<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelbros | Pixels to production.</title>
    <style>
        /* === CSS / STYLING === */
        :root {
            --bg-color: #fff;
            --text-main: #fe4845;
            --text-muted: #a0a0a0;
            --accent: #fe4845;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 3D Canvas Background */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Layout & Typography */
        main {
            position: relative;
            z-index: 1;
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10vw;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            align-items: flex-start;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .tagline {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--text-muted);
            font-weight: 300;
        }

        h2 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text-main);
        }

        p {
            font-size: 1.125rem;
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 20px;
        }

        .accent-text {
            color: var(--accent);
            font-weight: 600;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent);
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
        }

        .service-card h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .footer {
            min-height: 50vh;
            text-align: center;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 5vh;
        }
        
        .footer p {
            margin: 0 auto;
        }

        /* GSAP Animation Classes */
        .gsap-reveal {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Three.js Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Content -->
    <main>
        <section class="hero gsap-reveal">
            <h1>Pixelbros</h1>
            <p class="tagline">Pixels to production.</p>
        </section>

        <section class="footer gsap-reveal">
            <p style="margin-top: 20px; font-size: 0.8rem;">&copy; 2026 Pixelbros.online</p>
        </section>
    </main>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Application Logic -->
    <script>
        // === 1. THREE.JS SETUP ===
        const canvas = document.querySelector('#webgl-canvas');
        const scene = new THREE.Scene();
        // Add a slight fog to fade particles into the dark background
        scene.fog = new THREE.FogExp2(0x070707, 0.001);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // === 2. PARTICLE SYSTEM ("Pixels") ===
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2500; // Adjust for performance vs visual density
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Spread particles across a wide 3D space
            posArray[i] = (Math.random() - 0.5) * 150;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        // Accent color #2596be mapping to Three.js Color
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            color: new THREE.Color('#fe4845'),
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleMesh);

        // === 3. INTERACTIVITY & ANIMATION ===
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Gentle continuous rotation
            particleMesh.rotation.y = elapsedTime * 0.05;
            particleMesh.rotation.x = elapsedTime * 0.02;

            // Parallax interaction with mouse
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;
            
            particleMesh.rotation.y += 0.05 * (targetX - particleMesh.rotation.y);
            particleMesh.rotation.x += 0.05 * (targetY - particleMesh.rotation.x);

            // Wave effect on particles
            const positions = particleMesh.geometry.attributes.position.array;
            for(let i = 0; i < particlesCount; i++) {
                const i3 = i * 3;
                const x = particleMesh.geometry.attributes.position.array[i3];
                // Gently oscillate the Y position based on X and time
                particleMesh.geometry.attributes.position.array[i3 + 1] += Math.sin(elapsedTime + x) * 0.01;
            }
            particleMesh.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === 4. GSAP SCROLL ANIMATIONS ===
        gsap.registerPlugin(ScrollTrigger);

        // Tie the 3D camera position to the scroll bar (Parallax depth)
        gsap.to(camera.position, {
            z: 20, // Moves camera closer through the particles as you scroll
            x: 10,
            ease: "none",
            scrollTrigger: {
                trigger: "main",
                start: "top top",
                end: "bottom bottom",
                scrub: 1
            }
        });

        // Fade in text sections smoothly on scroll
        const sections = document.querySelectorAll('.gsap-reveal');
        sections.forEach((section) => {
            gsap.fromTo(section, 
                { autoAlpha: 0, y: 50 }, 
                {
                    duration: 1, 
                    autoAlpha: 1, 
                    y: 0, 
                    ease: "power3.out",
                    scrollTrigger: {
                        trigger: section,
                        start: "top 80%", // Triggers when the top of the section hits 80% of the viewport height
                        toggleActions: "play none none reverse"
                    }
                }
            );
        });
    </script>
</body>
</html>
